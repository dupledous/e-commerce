<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>E-Commerce</title>

    <!-- BOOTSTRAP -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
        rel="stylesheet">
</head>
<body>
    {% block nav %}
    <header>
        
        <div class="bg-light">
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <div class="container">
                    <a class="navbar-brand" href="/">Mi Tienda</a>
                    <div>
                        <a href="{% url 'productos' %}" class="btn btn-outline-light">Productos</a>
                        <a href="{% url 'carrito' %}" class="btn btn-outline-light">Carrito</a>
                        <div id="user-area">
                            <a href="{% url 'login' %}" class="btn btn-outline-warning">Iniciar sesión</a>
                        </div>
                        <script>
                        document.addEventListener("DOMContentLoaded", function() {
                            const username = localStorage.getItem("username");
                            if (username) {
                                document.getElementById("user-area").innerHTML = `
                                <span class="text-light me-3">Hola, ${username}</span>
                                <button class="btn btn-danger btn-sm" onclick="logout()">Salir</button>`;
                            }
                        });
                        function logout() {
                            localStorage.clear();
                            window.location.reload();
                            }
                            </script>


                    </div>
                </div>
            </nav>
        </div>
    </header>
{% endblock %}
<div class="container mt-4">
    <!-- CONTENIDO -->
    {% block content %}
    
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
