{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container py-5">

    <h2 class="fw-bold text-center mb-5">
        🛒 Mi Carrito
    </h2>

    <!-- Mensajes -->
    <div id="mensaje" class="alert d-none"></div>

    <!-- Contenedor de items -->
    <div id="carrito" class="row g-4 justify-content-center">
        <!-- Aquí JS cargará los productos -->
    </div>

    <hr class="my-4">

    <!-- Total -->
    <div class="text-end">
        <h3 class="fw-bold">
            Total: <span class="text-primary" id="total">$0</span>
        </h3>

    
    </div>
<h4 class="mt-4">📦 Dirección de envío</h4>

<div class="row">
    <div class="col-md-6 mb-2">
        <input type="text" id="direccion" class="form-control"
        placeholder="Dirección (calle y número)">
    </div>

    <div class="col-md-3 mb-2">
        <input type="text" id="ciudad" class="form-control"
        placeholder="Ciudad">
    </div>

    <div class="col-md-3 mb-2">
        <input type="text" id="comuna" class="form-control"
        placeholder="Comuna">
    </div>
    <button class="btn btn-success mt-3"
        onclick="crearPedido()">
    Confirmar Pedido
</button>
</div>



</div>




<script src="{% static 'js/carrito.js' %}"></script>

{% endblock %}
