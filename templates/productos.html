{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="hero pt-4 pb-3">
    <div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between">
        <div>
            <h2 class="fw-bold mb-1">Nuestros Productos</h2>
            <p class="text-muted mb-0">Explora todas las categorías disponibles.</p>
        </div>

        <div class="mt-3 mt-lg-0" style="max-width: 320px; width: 100%;">
            <div class="position-relative hero-search">
                <span class="search-icon">
                    <i class="bi bi-search"></i>
                </span>
                <input id="buscador" type="text" class="form-control"
                placeholder="Buscar productos...">
            </div>
        </div>
    </div>
</div>

<!-- Filtros de categoría -->
<div class="mb-3">
    <button class="category-pill active" data-cat="todos">Todos</button>
    <!-- El resto se rellena dinámicamente desde JS, o puedes crear botones fijos:
    <button class="category-pill" data-cat="Electrónicos">Electrónicos</button>
    -->
</div>

<div class="row" id="productos-container">
    <!-- Cards llenadas por JS -->
</div>

<script src="{% static 'js/productos.js' %}"></script>
{% endblock %}
