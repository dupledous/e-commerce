
{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container mt-5">
    <h2 class="mb-4">Confirmar Dirección</h2>

    <div class="mb-3">
        <label>Dirección de entrega</label>
        <input id="direccion" class="form-control" placeholder="Ej: Av. Siempre Viva 742">
    </div>

    <button class="btn btn-success btn-lg" onclick="crearPedido()">
        Confirmar y Pagar
    </button>

    <p id="msg" class="text-danger mt-3"></p>
</div>

<script src="{% static 'js/pedido.js' %}"></script>
{% endblock %}
