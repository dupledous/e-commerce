{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="container mt-5">
    <h2 class="text-center mb-4">Pagar Pedido</h2>

    <div class="card p-4 shadow">
        <h4>Pedido #{{ id }}</h4>

        <div id="detalle-pago" class="mt-3">
            <p>Cargando información...</p>
        </div>

        <button id="btnPagar" class="btn btn-primary btn-lg mt-3">
            Confirmar Pago
        </button>

        <p id="msg" class="mt-3 text-danger"></p>
    </div>
</div>

<script src="{% static 'js/pagar.js' %}"></script>

{% endblock %}
